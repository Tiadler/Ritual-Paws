<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shadesGradient" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" style="stop-color:#00E5C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008B8B;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Frame -->
  <rect x="30" y="80" width="140" height="40" rx="20" fill="#000"/>
  <rect x="35" y="85" width="130" height="30" rx="15" fill="url(#shadesGradient)"/>

  <!-- Lenses -->
  <rect x="45" y="90" width="50" height="20" rx="10" fill="#000"/>
  <rect x="105" y="90" width="50" height="20" rx="10" fill="#000"/>

  <!-- Lens reflections -->
  <circle cx="55" cy="95" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="65" cy="105" r="2" fill="#FFF" opacity="0.6"/>
  <circle cx="115" cy="95" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="125" cy="105" r="2" fill="#FFF" opacity="0.6"/>

  <!-- Bridge -->
  <rect x="95" y="85" width="10" height="30" fill="#000"/>

  <!-- Temples -->
  <rect x="10" y="95" width="25" height="10" rx="5" fill="#000"/>
  <rect x="165" y="95" width="25" height="10" rx="5" fill="#000"/>

  <!-- Temple details -->
  <circle cx="15" cy="100" r="2" fill="#666"/>
  <circle cx="170" cy="100" r="2" fill="#666"/>
</svg>