<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect x="0" y="0" width="300" height="200" fill="#F5F5DC"/>
  <!-- Window Frame -->
  <rect x="100" y="50" width="100" height="80" fill="#8B4513" stroke="#654321" stroke-width="4"/>
  <!-- Window Glass -->
  <rect x="104" y="54" width="92" height="72" fill="#87CEEB"/>
  <!-- Window Cross -->
  <line x1="150" y1="50" x2="150" y2="130" stroke="#8B4513" stroke-width="3"/>
  <line x1="100" y1="90" x2="200" y2="90" stroke="#8B4513" stroke-width="3"/>
  <!-- Window Sill -->
  <rect x="95" y="125" width="110" height="10" fill="#D2B48C"/>
</svg>