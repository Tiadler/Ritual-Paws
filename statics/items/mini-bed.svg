<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bedGradient" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Bed frame -->
  <rect x="30" y="120" width="140" height="60" rx="10" fill="url(#bedGradient)"/>
  <rect x="25" y="115" width="150" height="10" rx="5" fill="#654321"/>

  <!-- Mattress -->
  <rect x="35" y="125" width="130" height="50" rx="5" fill="#FFF8DC"/>
  <rect x="35" y="125" width="130" height="5" fill="#F5DEB3"/>

  <!-- Pillow -->
  <ellipse cx="100" cy="135" rx="25" ry="15" fill="#FFF"/>
  <ellipse cx="100" cy="135" rx="20" ry="10" fill="#F0F8FF"/>

  <!-- Blanket -->
  <rect x="35" y="150" width="130" height="25" fill="#4169E1"/>
  <rect x="35" y="150" width="130" height="3" fill="#000080"/>

  <!-- Bed legs -->
  <rect x="40" y="180" width="8" height="15" fill="#654321"/>
  <rect x="152" y="180" width="8" height="15" fill="#654321"/>
  <rect x="50" y="175" width="6" height="20" fill="#654321"/>
  <rect x="144" y="175" width="6" height="20" fill="#654321"/>
</svg>