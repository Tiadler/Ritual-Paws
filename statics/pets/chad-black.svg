  <ellipse cx="100" cy="140" rx="35" ry="40" fill="#1a1a1a"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#1a1a1a"/>
  <!-- Cool Hair -->
  <path d="M75 55 Q85 45 95 55 Q100 50 105 55 Q115 45 125 55" fill="#FFD700"/>
  <!-- Ears -->
  <polygon points="75,50 85,35 95,50" fill="#1a1a1a"/>
  <polygon points="105,50 115,35 125,50" fill="#1a1a1a"/>
  <!-- Sunglasses -->
  <rect x="80" y="70" width="15" height="8" rx="7" fill="#333"/>
  <rect x="105" y="70" width="15" height="8" rx="7" fill="#333"/>
  <line x1="95" y1="74" x2="105" y2="74" stroke="#333" stroke-width="3"/>
  <!-- Nose -->
  <polygon points="98,85 102,85 100,90" fill="#FF6B9D"/>
  <!-- Mouth -->
  <path d="M95 95 Q100 100 105 95" stroke="#FF6B9D" stroke-width="2" fill="none"/>
  <!-- Whiskers -->
  <line x1="70" y1="80" x2="85" y2="82" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="85" x2="85" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="115" y1="82" x2="130" y2="80" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="115" y1="85" x2="130" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Paws -->
  <ellipse cx="85" cy="165" rx="8" ry="12" fill="#1a1a1a"/>
  <ellipse cx="115" cy="165" rx="8" ry="12" fill="#1a1a1a"/>
  <!-- Tail -->
  <path d="M135 140 Q150 130 155 140 Q150 150 135 140" fill="#1a1a1a"/>
</svg>