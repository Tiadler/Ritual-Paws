<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="chadGradient" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#00E5C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BFA5;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="160" cy="160" r="150" fill="url(#chadGradient)" opacity="0.1"/>

  <!-- Cat body -->
  <ellipse cx="160" cy="220" rx="80" ry="60" fill="#FFF8DC"/>
  <ellipse cx="160" cy="180" rx="60" ry="50" fill="#FFF8DC"/>

  <!-- Cat ears -->
  <polygon points="120,140 130,110 140,140" fill="#FFF8DC"/>
  <polygon points="180,140 190,110 200,140" fill="#FFF8DC"/>
  <polygon points="125,135 135,115 145,135" fill="#00E5C4"/>
  <polygon points="175,135 185,115 195,135" fill="#00E5C4"/>

  <!-- Cool shades -->
  <rect x="130" y="155" width="60" height="15" rx="7" fill="#000"/>
  <rect x="135" y="160" width="50" height="5" fill="#333"/>
  <circle cx="145" cy="162.5" r="3" fill="#666"/>
  <circle cx="175" cy="162.5" r="3" fill="#666"/>

  <!-- Cat face (hidden by shades) -->
  <circle cx="145" cy="165" r="8" fill="#000" opacity="0.3"/>
  <circle cx="175" cy="165" r="8" fill="#000" opacity="0.3"/>

  <!-- Nose -->
  <polygon points="158,175 162,175 160,180" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 160 180 Q 155 185 150 180" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 160 180 Q 165 185 170 180" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <line x1="120" y1="175" x2="140" y2="175" stroke="#000" stroke-width="2"/>
  <line x1="180" y1="175" x2="200" y2="175" stroke="#000" stroke-width="2"/>
  <line x1="125" y1="185" x2="145" y2="185" stroke="#000" stroke-width="2"/>
  <line x1="175" y1="185" x2="195" y2="185" stroke="#000" stroke-width="2"/>

  <!-- Chad badge -->
  <circle cx="280" cy="40" r="25" fill="#00E5C4"/>
  <text x="280" y="47" text-anchor="middle" fill="white" font-size="12" font-weight="bold">CHAD</text>
</svg>